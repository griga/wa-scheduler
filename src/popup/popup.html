<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./popup.css">
  </head>

  <body>
    <h1>WhatsApp scheduler</h1>

    <form id="schedulerForm">
      <label for="groupChatName">groupchatname</label>
      <input id="groupChatName" name="groupChatName" autocomplete="off" required>

      <label for="messageText">messagetxt</label>
      <textarea id="messageText" name="messageText" required></textarea>

      <label for="scheduleTimes">scheduleTimes</label>
      <textarea
        id="scheduleTimes"
        name="scheduleTimes"
        placeholder="00:00 02:12 07:00"
        rows="4"
        required></textarea>

      <div class="actions">
        <button id="startBtn" type="submit">Start</button>
        <button id="updateBtn" type="submit" hidden>Update</button>
        <button id="stopBtn" type="button">Stop</button>
      </div>

      <details>
        <summary>Advanced: WhatsApp Selectors</summary>
        <p class="advanced-note">
          Keep these defaults unless WhatsApp Web changes. This section is for extension-level
          troubleshooting.
        </p>

        <label for="selectorChatsButton">Chats button selector</label>
        <input id="selectorChatsButton" name="selectorChatsButton" autocomplete="off" required>

        <label for="selectorChatListSearchContainer">Chat list search container selector</label>
        <input
          id="selectorChatListSearchContainer"
          name="selectorChatListSearchContainer"
          autocomplete="off"
          required>

        <label for="selectorChatListSearchInput">Chat list search input selector</label>
        <input
          id="selectorChatListSearchInput"
          name="selectorChatListSearchInput"
          autocomplete="off"
          required>

        <label for="selectorSearchResultsContainer">Search results container selector</label>
        <input
          id="selectorSearchResultsContainer"
          name="selectorSearchResultsContainer"
          autocomplete="off"
          required>

        <label for="selectorSearchNoChatsContainer">Search empty-state selector</label>
        <input
          id="selectorSearchNoChatsContainer"
          name="selectorSearchNoChatsContainer"
          autocomplete="off"
          required>

        <label for="selectorSearchResultTitleItem">Search result title item selector</label>
        <input
          id="selectorSearchResultTitleItem"
          name="selectorSearchResultTitleItem"
          autocomplete="off"
          required>

        <label for="selectorComposerTextbox">Message composer selector</label>
        <input
          id="selectorComposerTextbox"
          name="selectorComposerTextbox"
          autocomplete="off"
          required>

        <label for="selectorSendButton">Send button selector</label>
        <input id="selectorSendButton" name="selectorSendButton" autocomplete="off" required>
      </details>
    </form>

    <div id="status" class="status">Loading…</div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
